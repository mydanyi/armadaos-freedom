# Lenovo Xiaoxin Pad Pro GT (TB710FU) speakers.
# - 16-bit: the topology only offers S16_LE; this keeps it that way if the
#   topology ever changes, since a 24-bit front end makes the ADSP audio
#   process crash (it recovers and the card re-registers).
# - No idle suspend: each resume restarts the four amplifiers, and they
#   occasionally fail to lock to the TDM clock.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*"
        alsa.card_name = "Lenovo-TB710FU"
      }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
