# TB323FU ("baldur") ALSA UCM: without a profile PipeWire's
# ACP probe finds no usable device on this DPCM card and GNOME shows
# "Dummy Output". Speakers are MultiMedia1 -> PRIMARY_MI2S (two aw882xx),
# the internal mics MultiMedia2 <- TX_CODEC_DMA_TX_3 (tb323fu-audio-defaults
# sets the codec side at boot; these sequences only switch the routes).
Syntax 6

SectionUseCase."HiFi" {
	File "/Lenovo/TB323FU/HiFi.conf"
	Comment "Default"
}
