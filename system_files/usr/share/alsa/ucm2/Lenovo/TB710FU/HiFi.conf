# Lenovo Xiaoxin Pad Pro GT (TB710FU): four AW882xx amplifiers on
# SECONDARY_TDM_RX_0, fed by MultiMedia1. The amplifier volume controls are set
# to 10/10/0/0, which gives the register attenuation of the vendor Android
# (0x34/0x35 21 steps, 0x36/0x37 11 steps). There is no hardware volume
# element: the amplifiers and the DSP gain stay fixed and PipeWire uses
# software volume.
SectionVerb {
	EnableSequence [
		cset "name='SECONDARY_TDM_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 8192"
	]

	DisableSequence [
		cset "name='SECONDARY_TDM_RX_0 Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	EnableSequence [
		cset "name='aw_dev_0_monitor' 0"
		cset "name='aw_dev_1_monitor' 0"
		cset "name='aw_dev_2_monitor' 0"
		cset "name='aw_dev_3_monitor' 0"
		cset "name='aw_dev_0_volume' 10"
		cset "name='aw_dev_1_volume' 10"
		cset "name='aw_dev_2_volume' 0"
		cset "name='aw_dev_3_volume' 0"
		cset "name='aw_dev_0_switch' 1"
		cset "name='aw_dev_1_switch' 1"
		cset "name='aw_dev_2_switch' 1"
		cset "name='aw_dev_3_switch' 1"
	]

	DisableSequence [
		cset "name='aw_dev_0_switch' 0"
		cset "name='aw_dev_1_switch' 0"
		cset "name='aw_dev_2_switch' 0"
		cset "name='aw_dev_3_switch' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}
