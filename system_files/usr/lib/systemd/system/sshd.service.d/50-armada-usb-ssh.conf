# armada-usb-ssh.socket conflicts with sshd.service and stops while it runs; bring it back
# when the system-wide sshd is switched off again. The helper queues
# armada-usb-ssh-resume.service (After=sshd.service), so the deferred unit waits for the stop
# or restart transaction to finish before starting the socket; no sleeps here.
[Service]
ExecStopPost=-/usr/libexec/armada/usb-network ssh-resume
