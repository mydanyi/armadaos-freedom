# With ARMADA_USB_NETWORK=1 the MTP gadget also carries the USB network link
# (MTP + network composite device), so SSH over USB keeps working while USB file
# transfer is on. Without it every command below does nothing.
[Service]
# Release the controller held by the standalone link first; then, after the original
# setup has created c.1, add the network function to it before umtprd and bind.
ExecStartPre=+/usr/bin/systemctl stop armada-usb-network.service
ExecStartPre=+/usr/libexec/armada/usb-network attach /sys/kernel/config/usb_gadget/armada-mtp
# After the original unbind and before the original teardown removes c.1.
ExecStop=+/usr/libexec/armada/usb-network detach /sys/kernel/config/usb_gadget/armada-mtp
# After the teardown: the standalone link takes the controller back.
ExecStopPost=+/usr/libexec/armada/usb-network resume
