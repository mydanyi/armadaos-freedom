# SPDX-License-Identifier: MIT
# WirePlumber 0.5.18 fragment: auto-attach the TB323FU speaker protection
# software-DSP filter to the real HiFi speaker node. The filter graph itself
# lives in tb323fu-speakers-protection.json (same module args as the previous
# manual libpipewire-module-filter-chain instance).
#
# Only the HiFi speaker hardware node is matched, by exact node.name.
# No wildcard, no regex, no alsa.id fallback.
node.software-dsp.rules = [
  {
    matches = [
      { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
    ]
    actions = {
      create-filter = {
        filter-path = "/usr/share/tb323fu/pipewire/tb323fu-speakers-protection.json"
        hide-parent = true
      }
    }
  }
]

# node.software-dsp must run for the rule above to be applied. Only this key is
# set here; the other main-profile defaults keep their inherited values.
wireplumber.profiles = {
  main = {
    node.software-dsp = required
  }
}
