ARMADA_DEVICE_ID=lenovo-tb710fu
ARMADA_DEVICE_NAME='Lenovo Xiaoxin Pad Pro GT (TB710FU)'
ARMADA_SOC_CLASS=SM8650
# This model's Snapdragon 8 Gen 3 is a six-core part (Android also reports
# six). The SM8650 tree describes eight cores and cpu1 and cpu2 never come
# online. Online are cpu0 (Cortex-A520), cpu3-6 (Cortex-A720) and cpu7
# (Cortex-X4). The lists follow the DT numbering; if the DT ever drops the
# cpu1/cpu2 nodes, the logical CPUs become 0-5 and these change. Defaults
# only, so environment overrides (also empty ones) survive.
: "${ARMADA_LITTLE_CORES=0}"
: "${ARMADA_BIG_CORES=3-7}"
: "${ARMADA_PRIME_CORES=7}"
: "${ARMADA_IRQ_CORES=0}"
ARMADA_PRIMARY_TOUCHSCREEN='NVTCapacitiveTouchScreen'
# No built-in gamepad; InputPlumber exposes no CompositeDevice to wait for.
ARMADA_BUILTIN_GAMEPAD=0
